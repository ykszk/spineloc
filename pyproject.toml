[project]
authors = [{name = "Yuki Suzuki", email = "y-suzuki@radiol.med.osaka-u.ac.jp"}]
dependencies = ["albumentationsx[headless]>=2.0.14,<3"]
name = "spineloc"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.ruff]
line-length = 119

[tool.pixi.pypi-dependencies]
spineloc = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
pydantic = ">=2.12.5,<3"
numpy = ">=2.4.1,<3"
timm = ">=1.0.24,<2"
hydra-core = "*"
loguru = ">=0.7.3,<0.8"
joblib = ">=1.5.3,<2"
pillow = ">=12.1.0,<13"
lightning = ">=2.6.0,<3"
rich = ">=14.2.0,<15"

[tool.pixi.tasks]
train = "python scripts/train.py"

[tool.pixi.environments]
default = { solve-group = "default" }
cpu = { features = ["cpu"] }
gpu = { features = ["gpu"] }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = ">=2.9.1,<3"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.feature.test.dependencies]
ipykernel = ">=7.1.0,<8"

[tool.pixi.feature.gpu.system-requirements]
cuda = "12"

[tool.pixi.feature.gpu.dependencies]
cuda-version = "12*"
pytorch-gpu = "*"

[dependency-groups]
test = ["pytest"]
